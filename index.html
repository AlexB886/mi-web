<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alex Baicu | Start</title>

  <meta
    name="description"
    content="Bienvenido al mundo de Alex Baicu."
  >

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&family=Press+Start+2P&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="pantalla-inicio">
<audio
  id="gameStartSound"
  <audio id="gameStartSound" src="GAME-START-arcade-final.wav" preload="auto"></audio>
  preload="auto"
></audio>
  <main class="intro-screen">

    <!-- =====================================================
         VÍDEO DE FONDO
         ===================================================== -->

    <video
      class="intro-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-hidden="true"
    >
      <source src="intro.mp4" type="video/mp4">
    </video>

    <!-- Capa oscura muy suave -->
    <div
      class="intro-video-overlay"
      aria-hidden="true"
    ></div>


    <!-- =====================================================
         DECORACIÓN
         ===================================================== -->

    <span class="intro-corner top-left"></span>
    <span class="intro-corner top-right"></span>
    <span class="intro-corner bottom-left"></span>
    <span class="intro-corner bottom-right"></span>


    <!-- =====================================================
         CONTENIDO
         ===================================================== -->

    <div class="intro-content">

      <p class="intro-small">
        SYSTEM ONLINE
      </p>

      <h1 class="intro-title" id="introTitle">
  <span id="introTitleText">ALEX BAICU</span>
  <canvas
    id="nameParticles"
    class="name-particles"
    aria-hidden="true"
  ></canvas>
</h1>

      <p class="intro-subtitle">
        — BIENVENIDO A MI MUNDO —
      </p>

      <button
        class="intro-start"
        id="startBtn"
        type="button"
      >
        ▶ START
      </button>

      <p class="intro-hint">
        PRESS ENTER
      </p>

    </div>

  </main>


  <!-- =====================================================
       INTRO JS
       ===================================================== -->

 <script>

  const startBtn = document.getElementById("startBtn");
  const introTitle = document.getElementById("introTitle");
  const introTitleText = document.getElementById("introTitleText");
  const canvas = document.getElementById("nameParticles");

 /* ==========================================================
   ALEX BAICU — RGB + ESCRITURA + GLITCH
   ========================================================== */

if (introTitle && introTitleText) {

  const texto = "ALEX BAICU";

  const colores = [
    "#FF0055",
    "#FF7A00",
    "#FFE600",
    "#35FF00",
    "#00F6FF",
    "#0066FF",
    "#8A2BFF",
    "#FF00E6"
  ];

  let posicion = 0;
  let escribiendo = true;

  /*
   * Crea las letras visibles una a una.
   */
  function pintarTexto(cantidad) {

    introTitleText.innerHTML = "";

    for (let i = 0; i < cantidad; i++) {

      const caracter = texto[i];

      const letra =
        document.createElement("span");

      if (caracter === " ") {

        letra.className = "name-space";
        letra.innerHTML = "&nbsp;";

      } else {

        letra.className = "name-letter";

        letra.style.setProperty(
          "--i",
          i
        );

        letra.style.setProperty(
          "--letter-color",
          colores[
            (i + colorOffset) %
            colores.length
          ]
        );

        letra.textContent =
          caracter;

      }

      introTitleText.appendChild(
        letra
      );

    }

  }


  /*
   * Reserva siempre el espacio del nombre completo.
   * Así la página NO se mueve mientras se escribe/borrar.
   */
  introTitleText.style.width = "11ch";
  introTitleText.style.minWidth = "11ch";


  let colorOffset = 0;


  /* ========================================================
     CICLO ESCRIBIR / BORRAR
     ======================================================== */

  function animarNombre() {

    if (escribiendo) {

      posicion++;

      pintarTexto(posicion);

      if (posicion >= texto.length) {

        escribiendo = false;

        setTimeout(
          animarNombre,
          1100
        );

        return;

      }

      setTimeout(
        animarNombre,
        95
      );

    } else {

      posicion--;

      pintarTexto(posicion);

      if (posicion <= 0) {

        escribiendo = true;

        setTimeout(
          animarNombre,
          350
        );

        return;

      }

      setTimeout(
        animarNombre,
        60
      );

    }

  }


  /* ========================================================
     CAMBIO RÁPIDO DE COLORES
     ======================================================== */

  setInterval(() => {

    colorOffset++;

    const letras =
      introTitleText.querySelectorAll(
        ".name-letter"
      );

    letras.forEach(
      (letra, index) => {

        letra.style.setProperty(
          "--letter-color",
          colores[
            (
              index +
              colorOffset
            ) %
            colores.length
          ]
        );

      }
    );

  }, 180);


  /* ========================================================
     GLITCH — SIN SACUDIR LA PÁGINA
     ======================================================== */

  function activarGlitch() {

    introTitle.classList.remove(
      "glitch"
    );

    void introTitle.offsetWidth;

    introTitle.classList.add(
      "glitch"
    );

    setTimeout(() => {

      introTitle.classList.remove(
        "glitch"
      );

    }, 160);

  }


  function glitchAleatorio() {

    activarGlitch();

    setTimeout(
      glitchAleatorio,
      1600 +
      Math.random() * 2600
    );

  }


  setTimeout(
    glitchAleatorio,
    1800
  );


  /* ========================================================
     RATÓN
     ======================================================== */

  window.addEventListener(
    "pointermove",
    (event) => {

      const rect =
        introTitle.getBoundingClientRect();

      const centroX =
        rect.left +
        rect.width / 2;

      const centroY =
        rect.top +
        rect.height / 2;

      const distancia =
        Math.hypot(
          event.clientX - centroX,
          event.clientY - centroY
        );

      if (distancia < 320) {

        introTitle.classList.add(
          "pointer-near"
        );

      } else {

        introTitle.classList.remove(
          "pointer-near"
        );

      }

    }
  );


  /*
   * Arranca la animación.
   */
  pintarTexto(0);
  animarNombre();

}


  /* ==========================================================
     PARTÍCULAS CANVAS 2D
     ========================================================== */

  if (canvas && introTitle) {

    const ctx =
      canvas.getContext("2d");

    const particles = [];

    let mouse = {
      x: null,
      y: null,
      active: false
    };


    function resizeCanvas() {

      const rect =
        introTitle.getBoundingClientRect();

      const dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      canvas.width =
        rect.width * dpr + 90 * dpr;

      canvas.height =
        rect.height * dpr + 60 * dpr;

      canvas.style.width =
        `${rect.width + 90}px`;

      canvas.style.height =
        `${rect.height + 60}px`;

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

    }


    function crearParticula(
      x,
      y,
      fuerzaX = 0,
      fuerzaY = 0
    ) {

      particles.push({

        x,
        y,

        vx:
          (Math.random() - 0.5) * 0.8 +
          fuerzaX,

        vy:
          (Math.random() - 0.5) * 0.8 +
          fuerzaY,

        vida: 1,

        decay:
          0.008 +
          Math.random() * 0.018,

        size:
          1 +
          Math.random() * 2.5,

        hue:
          Math.random() * 360

      });

    }


    function emitirParticulas() {

      const width =
        canvas.clientWidth;

      const height =
        canvas.clientHeight;

      /* bordes del título */

      const cantidad =
        2 + Math.floor(
          Math.random() * 3
        );

      for (let i = 0; i < cantidad; i++) {

        const borde =
          Math.floor(
            Math.random() * 4
          );

        let x;
        let y;

        if (borde === 0) {
          x = Math.random() * width;
          y = 18;
        }

        else if (borde === 1) {
          x = width - 18;
          y = Math.random() * height;
        }

        else if (borde === 2) {
          x = Math.random() * width;
          y = height - 18;
        }

        else {
          x = 18;
          y = Math.random() * height;
        }

        crearParticula(
          x,
          y,
          (Math.random() - 0.5) * 0.8,
          (Math.random() - 0.5) * 0.8
        );

      }

    }


    function animarParticulas() {

      const width =
        canvas.clientWidth;

      const height =
        canvas.clientHeight;

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      if (
        Math.random() <
        0.35
      ) {
        emitirParticulas();
      }


      for (
        let i = particles.length - 1;
        i >= 0;
        i--
      ) {

        const p =
          particles[i];

        /* interacción con ratón */

        if (
          mouse.active &&
          mouse.x !== null &&
          mouse.y !== null
        ) {

          const dx =
            p.x - mouse.x;

          const dy =
            p.y - mouse.y;

          const distancia =
            Math.hypot(dx, dy);

          if (
            distancia < 90 &&
            distancia > 0
          ) {

            const fuerza =
              (90 - distancia) / 90;

            p.vx +=
              (dx / distancia) *
              fuerza *
              0.08;

            p.vy +=
              (dy / distancia) *
              fuerza *
              0.08;

          }

        }


        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.992;
        p.vy *= 0.992;

        p.vida -= p.decay;


        const alpha =
          Math.max(
            0,
            p.vida
          );


        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `hsla(${p.hue}, 100%, 70%, ${alpha})`;

        ctx.shadowBlur = 10;

        ctx.shadowColor =
          `hsla(${p.hue}, 100%, 65%, ${alpha})`;

        ctx.fill();


        if (
          p.vida <= 0 ||
          p.x < -50 ||
          p.x > width + 50 ||
          p.y < -50 ||
          p.y > height + 50
        ) {

          particles.splice(
            i,
            1
          );

        }

      }


      requestAnimationFrame(
        animarParticulas
      );

    }


    canvas.addEventListener(
      "mousemove",
      (event) => {

        const rect =
          canvas.getBoundingClientRect();

        mouse.x =
          event.clientX -
          rect.left;

        mouse.y =
          event.clientY -
          rect.top;

        mouse.active = true;

      }
    );


    canvas.addEventListener(
      "mouseleave",
      () => {

        mouse.active = false;

        mouse.x = null;
        mouse.y = null;

      }
    );


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();

    animarParticulas();

  }


  /* ==========================================================
     START
     ========================================================== */

  /* ==========================================================
   SONIDO ARCADE AL PULSAR START
   ========================================================== */

function sonidoStart() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  const ahora = audioCtx.currentTime;

  // Tono principal
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";

  osc.frequency.setValueAtTime(180, ahora);
  osc.frequency.exponentialRampToValueAtTime(850, ahora + 0.12);

  gain.gain.setValueAtTime(0.0001, ahora);
  gain.gain.exponentialRampToValueAtTime(0.28, ahora + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.18);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(ahora);
  osc.stop(ahora + 0.2);

  // Segundo golpe grave
  const bass = audioCtx.createOscillator();
  const bassGain = audioCtx.createGain();

  bass.type = "sawtooth";

  bass.frequency.setValueAtTime(90, ahora);
  bass.frequency.exponentialRampToValueAtTime(45, ahora + 0.18);

  bassGain.gain.setValueAtTime(0.0001, ahora);
  bassGain.gain.exponentialRampToValueAtTime(0.18, ahora + 0.01);
  bassGain.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.2);

  bass.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bass.start(ahora);
  bass.stop(ahora + 0.2);
}


/* ==========================================================
   START + SONIDO ARCADE
   ========================================================== */

const gameStartSound =
  document.getElementById("gameStartSound");

startBtn.addEventListener(
  "click",
  () => {

    /* Reiniciar el sonido por si se pulsa otra vez */
    if (gameStartSound) {
      gameStartSound.currentTime = 0;
      gameStartSound.volume = 0.40;

      gameStartSound.play().catch(() => {});
    }

    /* Animación de salida */
    document.body.classList.add(
      "intro-exit"
    );

    /* Ir a portada */
    setTimeout(
      () => {

        window.location.href =
          "portada.html";

      },
      2580
    );

  }
);
  

</script>
</body>
</html>
