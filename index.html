  <!-- =====================================================
       INTRO JS
       ===================================================== -->

 <script>

  const startBtn = document.getElementById("startBtn");
  const introTitle = document.getElementById("introTitle");
  const introTitleText = document.getElementById("introTitleText");
  const canvas = document.getElementById("nameParticles");

 /* ==========================================================
   ALEX BAICU — RGB + ESCRITURA + GLITCH
   ========================================================== */

if (introTitle && introTitleText) {

  const texto = "ALEX BAICU";

  const colores = [
    "#FF0055",
    "#FF7A00",
    "#FFE600",
    "#35FF00",
    "#00F6FF",
    "#0066FF",
    "#8A2BFF",
    "#FF00E6"
  ];

  let posicion = 0;
  let escribiendo = true;

  /*
   * Crea las letras visibles una a una.
   */
  function pintarTexto(cantidad) {

    introTitleText.innerHTML = "";

    for (let i = 0; i < cantidad; i++) {

      const caracter = texto[i];

      const letra =
        document.createElement("span");

      if (caracter === " ") {

        letra.className = "name-space";
        letra.innerHTML = "&nbsp;";

      } else {

        letra.className = "name-letter";

        letra.style.setProperty(
          "--i",
          i
        );

        letra.style.setProperty(
          "--letter-color",
          colores[
            (i + colorOffset) %
            colores.length
          ]
        );

        letra.textContent =
          caracter;

      }

      introTitleText.appendChild(
        letra
      );

    }

  }


  /*
   * Reserva siempre el espacio del nombre completo.
   * Así la página NO se mueve mientras se escribe/borrar.
   */
  introTitleText.style.width = "11ch";
  introTitleText.style.minWidth = "11ch";


  let colorOffset = 0;


  /* ========================================================
     CICLO ESCRIBIR / BORRAR
     ======================================================== */

  function animarNombre() {

    if (escribiendo) {

      posicion++;

      pintarTexto(posicion);

      if (posicion >= texto.length) {

        escribiendo = false;

        setTimeout(
          animarNombre,
          1100
        );

        return;

      }

      setTimeout(
        animarNombre,
        95
      );

    } else {

      posicion--;

      pintarTexto(posicion);

      if (posicion <= 0) {

        escribiendo = true;

        setTimeout(
          animarNombre,
          350
        );

        return;

      }

      setTimeout(
        animarNombre,
        60
      );

    }

  }


  /* ========================================================
     CAMBIO RÁPIDO DE COLORES
     ======================================================== */

  setInterval(() => {

    colorOffset++;

    const letras =
      introTitleText.querySelectorAll(
        ".name-letter"
      );

    letras.forEach(
      (letra, index) => {

        letra.style.setProperty(
          "--letter-color",
          colores[
            (
              index +
              colorOffset
            ) %
            colores.length
          ]
        );

      }
    );

  }, 180);


  /* ========================================================
     GLITCH — SIN SACUDIR LA PÁGINA
     ======================================================== */

  function activarGlitch() {

    introTitle.classList.remove(
      "glitch"
    );

    void introTitle.offsetWidth;

    introTitle.classList.add(
      "glitch"
    );

    setTimeout(() => {

      introTitle.classList.remove(
        "glitch"
      );

    }, 160);

  }


  function glitchAleatorio() {

    activarGlitch();

    setTimeout(
      glitchAleatorio,
      1600 +
      Math.random() * 2600
    );

  }


  setTimeout(
    glitchAleatorio,
    1800
  );


  /* ========================================================
     RATÓN
     ======================================================== */

  window.addEventListener(
    "pointermove",
    (event) => {

      const rect =
        introTitle.getBoundingClientRect();

      const centroX =
        rect.left +
        rect.width / 2;

      const centroY =
        rect.top +
        rect.height / 2;

      const distancia =
        Math.hypot(
          event.clientX - centroX,
          event.clientY - centroY
        );

      if (distancia < 320) {

        introTitle.classList.add(
          "pointer-near"
        );

      } else {

        introTitle.classList.remove(
          "pointer-near"
        );

      }

    }
  );


  /*
   * Arranca la animación.
   */
  pintarTexto(0);
  animarNombre();

}


  /* ==========================================================
     PARTÍCULAS CANVAS 2D
     ========================================================== */

  if (canvas && introTitle) {

    const ctx =
      canvas.getContext("2d");

    const particles = [];

    let mouse = {
      x: null,
      y: null,
      active: false
    };


    function resizeCanvas() {

      const rect =
        introTitle.getBoundingClientRect();

      const dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      canvas.width =
        rect.width * dpr + 90 * dpr;

      canvas.height =
        rect.height * dpr + 60 * dpr;

      canvas.style.width =
        `${rect.width + 90}px`;

      canvas.style.height =
        `${rect.height + 60}px`;

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

    }


    function crearParticula(
      x,
      y,
      fuerzaX = 0,
      fuerzaY = 0
    ) {

      particles.push({

        x,
        y,

        vx:
          (Math.random() - 0.5) * 0.8 +
          fuerzaX,

        vy:
          (Math.random() - 0.5) * 0.8 +
          fuerzaY,

        vida: 1,

        decay:
          0.008 +
          Math.random() * 0.018,

        size:
          1 +
          Math.random() * 2.5,

        hue:
          Math.random() * 360

      });

    }


    function emitirParticulas() {

      const width =
        canvas.clientWidth;

      const height =
        canvas.clientHeight;

      /* bordes del título */

      const cantidad =
        2 + Math.floor(
          Math.random() * 3
        );

      for (let i = 0; i < cantidad; i++) {

        const borde =
          Math.floor(
            Math.random() * 4
          );

        let x;
        let y;

        if (borde === 0) {
          x = Math.random() * width;
          y = 18;
        }

        else if (borde === 1) {
          x = width - 18;
          y = Math.random() * height;
        }

        else if (borde === 2) {
          x = Math.random() * width;
          y = height - 18;
        }

        else {
          x = 18;
          y = Math.random() * height;
        }

        crearParticula(
          x,
          y,
          (Math.random() - 0.5) * 0.8,
          (Math.random() - 0.5) * 0.8
        );

      }

    }


    function animarParticulas() {

      const width =
        canvas.clientWidth;

      const height =
        canvas.clientHeight;

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      if (
        Math.random() <
        0.35
      ) {
        emitirParticulas();
      }


      for (
        let i = particles.length - 1;
        i >= 0;
        i--
      ) {

        const p =
          particles[i];

        /* interacción con ratón */

        if (
          mouse.active &&
          mouse.x !== null &&
          mouse.y !== null
        ) {

          const dx =
            p.x - mouse.x;

          const dy =
            p.y - mouse.y;

          const distancia =
            Math.hypot(dx, dy);

          if (
            distancia < 90 &&
            distancia > 0
          ) {

            const fuerza =
              (90 - distancia) / 90;

            p.vx +=
              (dx / distancia) *
              fuerza *
              0.08;

            p.vy +=
              (dy / distancia) *
              fuerza *
              0.08;

          }

        }


        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.992;
        p.vy *= 0.992;

        p.vida -= p.decay;


        const alpha =
          Math.max(
            0,
            p.vida
          );


        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `hsla(${p.hue}, 100%, 70%, ${alpha})`;

        ctx.shadowBlur = 10;

        ctx.shadowColor =
          `hsla(${p.hue}, 100%, 65%, ${alpha})`;

        ctx.fill();


        if (
          p.vida <= 0 ||
          p.x < -50 ||
          p.x > width + 50 ||
          p.y < -50 ||
          p.y > height + 50
        ) {

          particles.splice(
            i,
            1
          );

        }

      }


      requestAnimationFrame(
        animarParticulas
      );

    }


    canvas.addEventListener(
      "mousemove",
      (event) => {

        const rect =
          canvas.getBoundingClientRect();

        mouse.x =
          event.clientX -
          rect.left;

        mouse.y =
          event.clientY -
          rect.top;

        mouse.active = true;

      }
    );


    canvas.addEventListener(
      "mouseleave",
      () => {

        mouse.active = false;

        mouse.x = null;
        mouse.y = null;

      }
    );


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();

    animarParticulas();

  }


  /* ==========================================================
     START
     ========================================================== */

  /* ==========================================================
   SONIDO ARCADE AL PULSAR START
   ========================================================== */

function sonidoStart() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  const ahora = audioCtx.currentTime;

  // Tono principal
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";

  osc.frequency.setValueAtTime(180, ahora);
  osc.frequency.exponentialRampToValueAtTime(850, ahora + 0.12);

  gain.gain.setValueAtTime(0.0001, ahora);
  gain.gain.exponentialRampToValueAtTime(0.28, ahora + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.18);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(ahora);
  osc.stop(ahora + 0.2);

  // Segundo golpe grave
  const bass = audioCtx.createOscillator();
  const bassGain = audioCtx.createGain();

  bass.type = "sawtooth";

  bass.frequency.setValueAtTime(90, ahora);
  bass.frequency.exponentialRampToValueAtTime(45, ahora + 0.18);

  bassGain.gain.setValueAtTime(0.0001, ahora);
  bassGain.gain.exponentialRampToValueAtTime(0.18, ahora + 0.01);
  bassGain.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.2);

  bass.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bass.start(ahora);
  bass.stop(ahora + 0.2);
}


/* ==========================================================
   START + SONIDO ARCADE
   ========================================================== */

const gameStartSound =
  document.getElementById("gameStartSound");


startBtn.addEventListener("click", () => {
  /* Reiniciar el sonido arcade */
  if (gameStartSound) {
    gameStartSound.currentTime = 0;
    gameStartSound.volume = 0.4;
    gameStartSound.play().catch(() => {});
  }

  /* Activar la salida de la introducción */
  document.body.classList.add("intro-exit");

  /* Mostrar la batalla en esta misma página */
  setTimeout(() => {
    document.body.classList.add("battle-active");
  }, 600);

  /* Marcar el impacto */
  setTimeout(() => {
    document.body.classList.add("battle-impact");
  }, 2400);

  /* Entrar en posición de combate */
  setTimeout(() => {
    document.body.classList.add("battle-ready");
  }, 3000);
});

  

/* =====================================================
   ATAQUES DE LA BATALLA
   ===================================================== */

const battleDino = document.getElementById("battleDino");
const battleLion = document.getElementById("battleLion");
const battleScene = document.getElementById("battleScene");
const lionHealthBar = document.querySelector(".lion-health");
const lionHealthText = document.querySelector(".lion-info small");
const attackButtons = document.querySelectorAll(".battle-button");

let lionHP = 100;
let attackBusy = false;

/* Sonidos arcade generados por el navegador */
function playBattleSound(type) {
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) return;

  const audio = new AudioContextClass();
  const now = audio.currentTime;

  const sounds = {
    fire:     { frequency: 180, end: 65, duration: 0.30, wave: "sawtooth" },
    punch:    { frequency: 130, end: 45, duration: 0.18, wave: "square" },
    tail:     { frequency: 100, end: 35, duration: 0.28, wave: "triangle" },
    impact:   { frequency: 75,  end: 30, duration: 0.20, wave: "sawtooth" }
  };

  const sound = sounds[type];
  if (!sound) {
    audio.close();
    return;
  }

  const oscillator = audio.createOscillator();
  const volume = audio.createGain();

  oscillator.type = sound.wave;
  oscillator.frequency.setValueAtTime(sound.frequency, now);
  oscillator.frequency.exponentialRampToValueAtTime(
    sound.end,
    now + sound.duration
  );

  volume.gain.setValueAtTime(0.18, now);
  volume.gain.exponentialRampToValueAtTime(
    0.001,
    now + sound.duration
  );

  oscillator.connect(volume);
  volume.connect(audio.destination);

  oscillator.start(now);
  oscillator.stop(now + sound.duration);

  oscillator.onended = () => audio.close();
}

/* Ejecutar el ataque elegido */

/* Ejecutar el ataque elegido */

/* Ejecutar un ataque arcade con movimiento e impacto */
function performAttack(type) {
  if (!document.body.classList.contains("battle-ready")) return;
  if (attackBusy || lionHP <= 0) return;

  attackBusy = true;

  const damage = {
    fire: 20,
    punch: 18,
    tail: 24
  };

  const attackClass = {
    fire: "attack-fire",
    punch: "attack-punch",
    tail: "attack-tail"
  };

  const selectedClass = attackClass[type];
  if (!selectedClass) {
    attackBusy = false;
    return;
  }

  battleDino.classList.remove(
    "attack-fire", "attack-punch", "attack-tail"
  );

  battleLion.classList.remove(
    "lion-hit", "lion-knockback", "lion-defeated"
  );

  battleScene.classList.remove("fire-flash", "arcade-impact");

  void battleDino.offsetWidth;
  battleDino.classList.add(selectedClass);
  playBattleSound(type);

  /* Llamarada visual */
  if (type === "fire") {
    const flame = document.createElement("div");
    flame.className = "fire-projectile";
    flame.textContent = "🔥";
    battleScene.appendChild(flame);
    setTimeout(() => flame.remove(), 750);
  }

  /* Impacto sincronizado con el ataque */
  const impactDelay = type === "fire" ? 420 : 300;

  setTimeout(() => {
    if (lionHP <= 0) return;

    battleLion.classList.remove("lion-hit", "lion-knockback");
    void battleLion.offsetWidth;

    battleLion.classList.add("lion-hit", "lion-knockback");
    battleScene.classList.add("arcade-impact");
    playBattleSound("impact");

    const spark = document.createElement("div");
    spark.className = "attack-spark";
    spark.textContent = type === "fire" ? "🔥" : "💥";
    battleScene.appendChild(spark);
    setTimeout(() => spark.remove(), 500);

    if (type === "fire") {
      battleScene.classList.add("fire-flash");
      setTimeout(() => {
        battleScene.classList.remove("fire-flash");
      }, 220);
    }

    setTimeout(() => {
      battleScene.classList.remove("arcade-impact");
    }, 220);

    lionHP = Math.max(0, lionHP - damage[type]);
    lionHealthBar.style.width = lionHP + "%";
    lionHealthText.textContent = "HP " + lionHP;

   
if (lionHP <= 0) {
  battleLion.classList.remove("lion-hit", "lion-knockback");
  battleLion.classList.add("lion-defeated");

  if (!battleScene.classList.contains("battle-victory-transition")) {
    battleScene.classList.add("battle-victory-transition");

    setTimeout(() => {
      window.location.href = "portada.html";
    }, 2000);
  }
}

  }, impactDelay);

  /* Recuperación */
  setTimeout(() => {
    battleDino.classList.remove(selectedClass);
    battleLion.classList.remove("lion-hit", "lion-knockback");
    battleScene.classList.remove("fire-flash", "arcade-impact");
    attackBusy = false;
  }, 950);
}
/* Conectar los tres botones de ataque */
document.querySelectorAll(".battle-button[data-attack]").forEach((button) => {
  button.addEventListener("click", () => {
    performAttack(button.dataset.attack);
  });
});



</script>
