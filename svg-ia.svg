<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 500"
  role="img"
  aria-labelledby="titulo descripcion"
>

  <title id="titulo">
    Inteligencia artificial y aprendizaje
  </title>

  <desc id="descripcion">
    Ilustración de una red de conexiones que representa el uso de
    inteligencia artificial como apoyo al aprendizaje y al desarrollo.
  </desc>


  <defs>

    <radialGradient
      id="fondo"
      cx="50%"
      cy="45%"
      r="70%"
    >

      <stop
        offset="0%"
        stop-color="#2A1715"
      />

      <stop
        offset="100%"
        stop-color="#0C0A09"
      />

    </radialGradient>

  </defs>


  <!-- FONDO -->

  <rect
    x="25"
    y="25"
    width="750"
    height="450"
    rx="24"
    fill="url(#fondo)"
    stroke="#B5654A"
    stroke-width="3"
  />


  <!-- RED DE CONEXIONES -->

  <g
    stroke="#C9A66B"
    stroke-width="2"
    opacity="0.55"
  >

    <line x1="170" y1="150" x2="320" y2="105"/>
    <line x1="170" y1="150" x2="320" y2="250"/>
    <line x1="170" y1="150" x2="300" y2="375"/>

    <line x1="320" y1="105" x2="470" y2="170"/>
    <line x1="320" y1="250" x2="470" y2="170"/>
    <line x1="320" y1="250" x2="470" y2="335"/>
    <line x1="300" y1="375" x2="470" y2="335"/>

    <line x1="470" y1="170" x2="625" y2="250"/>
    <line x1="470" y1="335" x2="625" y2="250"/>

  </g>


  <!-- NODOS -->

  <circle
    cx="170"
    cy="150"
    r="16"
    fill="#C9A66B"
  />

  <circle
    cx="320"
    cy="105"
    r="16"
    fill="#F5F2EC"
  />

  <circle
    cx="320"
    cy="250"
    r="21"
    fill="#B5654A"
  />

  <circle
    cx="300"
    cy="375"
    r="16"
    fill="#C9A66B"
  />

  <circle
    cx="470"
    cy="170"
    r="19"
    fill="#C9A66B"
  />

  <circle
    cx="470"
    cy="335"
    r="19"
    fill="#F5F2EC"
  />

  <circle
    cx="625"
    cy="250"
    r="29"
    fill="#B5654A"
  />

  <circle
    cx="625"
    cy="250"
    r="14"
    fill="#F5F2EC"
  />


  <!-- TEXTO -->

  <text
    x="400"
    y="430"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="25"
    font-weight="600"
    letter-spacing="4"
    fill="#F5F2EC"
  >
    INTELIGENCIA ARTIFICIAL
  </text>

  <text
    x="400"
    y="458"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="15"
    letter-spacing="2"
    fill="#C9A66B"
  >
    APRENDER · PROBAR · CREAR
  </text>

</svg>