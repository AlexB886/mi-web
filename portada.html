 <script>
/* ==========================================================
   API DEL TIEMPO — SELECTOR DE CIUDADES
   ========================================================== */

const weatherWidget =
  document.getElementById("weatherWidget");


if (weatherWidget) {

  const weatherCity =
    document.getElementById("weatherCity");


  const ciudades = {

    xativa: {
      nombre: "Xàtiva",
      lat: 38.9904,
      lon: -0.5185
    },

    valencia: {
      nombre: "Valencia",
      lat: 39.4699,
      lon: -0.3763
    },

    barcelona: {
      nombre: "Barcelona",
      lat: 41.3874,
      lon: 2.1686
    },

    madrid: {
      nombre: "Madrid",
      lat: 40.4168,
      lon: -3.7038
    },

    manuel: {
      nombre: "Manuel",
      lat: 39.0502,
      lon: -0.4927
    }

  };


  function obtenerClima(
    code,
    isDay
  ) {

    const estados = {

      0: ["☀️", "Despejado"],
      1: ["🌤️", "Principalmente despejado"],
      2: ["⛅", "Parcialmente nublado"],
      3: ["☁️", "Nublado"],

      45: ["🌫️", "Niebla"],
      48: ["🌫️", "Niebla"],

      51: ["🌦️", "Llovizna"],
      53: ["🌦️", "Llovizna"],
      55: ["🌦️", "Llovizna"],

      61: ["🌧️", "Lluvia"],
      63: ["🌧️", "Lluvia"],
      65: ["🌧️", "Lluvia fuerte"],

      71: ["🌨️", "Nieve"],
      73: ["🌨️", "Nieve"],
      75: ["❄️", "Nieve"],

      80: ["🌦️", "Chubascos"],
      81: ["🌦️", "Chubascos"],
      82: ["🌧️", "Chubascos fuertes"],

      95: ["⛈️", "Tormenta"],
      96: ["⛈️", "Tormenta"],
      99: ["⛈️", "Tormenta"]

    };


    if (
      code === 0 &&
      !isDay
    ) {

      return [
        "🌙",
        "Noche despejada"
      ];

    }


    return estados[code] ||
      ["🌡️", "Desconocido"];

  }


  async function cargarTiempo(
    ciudadId
  ) {

    const ciudad =
      ciudades[ciudadId];


    if (!ciudad) {
      return;
    }


    document.getElementById(
      "weatherCityName"
    ).textContent =
      ciudad.nombre;


    document.getElementById(
      "weatherDescription"
    ).textContent =
      "Cargando...";


    const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${ciudad.lat}` +
      `&longitude=${ciudad.lon}` +
      `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day` +
      `&timezone=Europe%2FMadrid`;


    try {

      const respuesta =
        await fetch(url);


      if (!respuesta.ok) {

        throw new Error(
          "Error en la API"
        );

      }


      const data =
        await respuesta.json();


      const current =
        data.current;


      const [
        icono,
        descripcion
      ] =
        obtenerClima(
          current.weather_code,
          current.is_day
        );


      document.getElementById(
        "weatherIcon"
      ).textContent =
        icono;


      document.getElementById(
        "weatherTemperature"
      ).textContent =
        `${Math.round(current.temperature_2m)}°`;


      document.getElementById(
        "weatherDescription"
      ).textContent =
        descripcion;


      document.getElementById(
        "weatherHumidity"
      ).textContent =
        `${Math.round(current.relative_humidity_2m)}%`;


      document.getElementById(
        "weatherWind"
      ).textContent =
        `${Math.round(current.wind_speed_10m)} km/h`;


    } catch (error) {

      console.error(
        "Error obteniendo el tiempo:",
        error
      );


      document.getElementById(
        "weatherDescription"
      ).textContent =
        "Datos no disponibles";

    }

  }


  weatherCity.addEventListener(
    "change",
    () => {

      cargarTiempo(
        weatherCity.value
      );

    }
  );


  /* XÀTIVA = CIUDAD PRINCIPAL */

  cargarTiempo("xativa");

}
</script>
