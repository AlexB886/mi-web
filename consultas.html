<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consultas de Alex Baicu.">
  <meta name="theme-color" content="#0a2540">
  <title>Consultas | Alex Baicu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo animado + velo -->
  <div class="bg-animated" aria-hidden="true"></div>
  <div class="bg-veil" aria-hidden="true"></div>

  <!-- Cabecera -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Alex Baicu</a>
      <nav class="main-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html#sobre-mi">Sobre mí</a></li>
          <li><a href="index.html#hecho">Lo que he hecho</a></li>
          <li><a href="index.html#me-gusta">Me gusta</a></li>
          <li><a href="consultas.html" aria-current="page">Consultas</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
      <button id="themeBtn" class="theme-toggle" type="button" aria-label="Cambiar modo claro u oscuro">🌙 Modo oscuro</button>
    </div>
  </header>

  <main>
    <section class="hero hero-consultas">
      <div class="hero-content">
        <p class="eyebrow">Hablemos</p>
        <h1>Consultas</h1>
        <p class="hero-sub">Cuéntame qué necesitas y lo revisamos juntos.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="formConsultas" class="form-consultas" novalidate>
          <div class="form-field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
          </div>
          <div class="form-field">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
          </div>
          <div class="form-field">
            <label for="consulta">Tipo de consulta</label>
            <select id="consulta" name="consulta" required>
              <option value="">Selecciona una opción</option>
              <option value="numero">¿Cuál es tu número de contacto?</option>
              <option value="agendar">¿Cómo puedo agendar contigo una consulta?</option>
              <option value="servicios">Me interesan tus servicios, ¿cómo lo gestionamos?</option>
            </select>
          </div>
          <div class="form-field">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntame tu consulta" required></textarea>
          </div>
          <div class="form-check">
            <input type="checkbox" id="acepto" name="acepto" required>
            <label for="acepto">Acepto que mis datos se usen para responder a esta consulta.</label>
          </div>
          <button type="submit" class="button">Enviar consulta</button>
          <p id="mensajeFormulario" class="form-feedback" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="contacto" class="site-footer">
    <div class="container footer-inner">
      <h2>Contacto</h2>
      <address class="contact-list">
        <a href="mailto:baicualex88@gmail.com">baicualex88@gmail.com</a>
        <span>Valencia, España</span>
                <a href="https://github.com/AlexB886" target="_blank" rel="noopener" aria-label="GitHub de Alex Baicu" class="gh-link">
          <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span>GitHub</span>
        </a>
      </address>
      <p class="copy">© <span id="anio"></span> Alex Baicu.</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
