<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 500"
  role="img"
  aria-labelledby="titulo descripcion"
>

  <title id="titulo">
    Desarrollo web con HTML, CSS y JavaScript
  </title>

  <desc id="descripcion">
    Ilustración de una ventana de código que representa el desarrollo web
    mediante HTML, CSS y JavaScript.
  </desc>


  <defs>

    <linearGradient
      id="fondo"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#1c1511"
      />

      <stop
        offset="100%"
        stop-color="#0c0a09"
      />
    </linearGradient>

  </defs>


  <!-- VENTANA -->

  <rect
    x="25"
    y="25"
    width="750"
    height="450"
    rx="24"
    fill="url(#fondo)"
    stroke="#C9A66B"
    stroke-width="3"
  />


  <!-- CABECERA -->

  <rect
    x="25"
    y="25"
    width="750"
    height="65"
    rx="24"
    fill="#17120F"
  />

  <rect
    x="25"
    y="65"
    width="750"
    height="25"
    fill="#17120F"
  />


  <!-- BOTONES -->

  <circle
    cx="60"
    cy="57"
    r="9"
    fill="#B5654A"
  />

  <circle
    cx="88"
    cy="57"
    r="9"
    fill="#C9A66B"
  />

  <circle
    cx="116"
    cy="57"
    r="9"
    fill="#F5F2EC"
  />


  <!-- NOMBRE DEL ARCHIVO -->

  <text
    x="150"
    y="64"
    font-family="Inter, Arial, sans-serif"
    font-size="21"
    fill="#F5F2EC"
  >
    portfolio.js
  </text>


  <!-- CÓDIGO -->

  <text
    x="75"
    y="145"
    font-family="monospace"
    font-size="25"
    fill="#C9A66B"
  >
    &lt;main&gt;
  </text>


  <text
    x="110"
    y="190"
    font-family="monospace"
    font-size="24"
    fill="#F5F2EC"
  >
    &lt;h1&gt;
    <tspan fill="#B5654A">Alex Baicu</tspan>
    &lt;/h1&gt;
  </text>


  <text
    x="110"
    y="235"
    font-family="monospace"
    font-size="24"
    fill="#F5F2EC"
  >
    &lt;p&gt;
    <tspan fill="#C9A66B">Desarrollador en formación</tspan>
    &lt;/p&gt;
  </text>


  <text
    x="110"
    y="280"
    font-family="monospace"
    font-size="24"
    fill="#F5F2EC"
  >
    const
    <tspan fill="#B5654A"> portfolio </tspan>
    =
    <tspan fill="#C9A66B">"crear"</tspan>;
  </text>


  <text
    x="110"
    y="325"
    font-family="monospace"
    font-size="24"
    fill="#F5F2EC"
  >
    portfolio.
    <tspan fill="#B5654A">desarrollar</tspan>
    ();
  </text>


  <!-- CURSOR -->

  <rect
    x="75"
    y="365"
    width="3"
    height="28"
    fill="#C9A66B"
  />


  <!-- PIE -->

  <text
    x="75"
    y="435"
    font-family="Inter, Arial, sans-serif"
    font-size="17"
    letter-spacing="2"
    fill="#A9A19A"
  >
    HTML · CSS · JAVASCRIPT
  </text>

</svg>